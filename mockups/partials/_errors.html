<!--
  _errors.html — reference structure for a form's error summary.
  SPEC §16.3: errors are identified in text, associated with the
  offending field, and describe the fix (WCAG 3.3.1, 3.3.3).

  Not a literal {{include}} — the list of errors differs per form.
  Pages copy this shape, replacing the bracketed tokens. Each summary
  item links to the field it describes; the field itself repeats the
  same message next to its input (see _field.html's aria-describedby
  pattern) so the error reads correctly however it is reached.
-->
<div class="error-summary" role="alert" tabindex="-1">
  <h2>[N] problem(s) with this form</h2>
  <ul>
    <li><a href="#[field-id]">[Honest message stating the fix]</a></li>
  </ul>
</div>
